# GMSE04 - Super Mario Eclipse (Super Mario Sunshine mod, Kuribo + BetterSunshineEngine)

[Core]
# iCube forces "Speed up Disc Transfer Rate" on for every title (DolphinCoreService applies it at
# launch, DOLConfigBridge re-applies it on reset). With it on, BetterSunshineEngine's boot-time
# CARDMount of the memory card fails and the mod OSPanics on emulators ("Failed to mount memory
# card for loading module settings!"), so the title never gets past the Kuribo loader. Verified on
# an iPhone 16 Pro Max: every boot with the flag on fails at that exact spot regardless of CPU core
# (interpreter or cached interpreter) or any CIR flag; with it off the title boots and renders.
FastDiscSpeed = False
