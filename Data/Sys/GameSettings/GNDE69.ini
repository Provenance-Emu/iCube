# GNDE69 - Need for Speed: Underground

[Core]
# Values set here will override the main Dolphin settings.
# The race is bound by the cached interpreter running paired-single math (ps_madds/ps_mul/NI_madd
# lead the CPU-thread profile). The NEON paired-single fast path is +4.3 % emulation speed here:
# +5.0/+3.8/+4.0 % over three palindrome sweeps (12 x 30 s legs, uncapped, iPhone 16 Pro Max,
# 2026-10-07), and 60 s under CIRPsNeonValidate raised no mismatch. (It measured -1.2 % on Wind
# Waker, which is not paired-single bound, so it stays off by default.)
CIRPsNeon = True

[OnFrame]
# Add memory patches to be applied every frame here.

[ActionReplay]
# Add action replay cheats here.

[Video_Settings]
# The race re-binds its large track textures many times per frame, and the texture cache re-hashes
# the backing memory on every re-bind. With the global accuracy at "Safe" (0 = hash every texel)
# that hashing was 19 % of the video thread on an iPhone 16 Pro Max (Time Profiler, 2026-10-07).
# The title has no texture-update issue at upstream's sampled default, so pin it here.
SafeTextureCacheColorSamples = 128
