name: Lint

# Lint/format only -- intentionally NOT a build.
# The xcframework build needs a big self-hosted runner (it OOMs heavy -Ofast TUs);
# the existing build.yml / release.yml already cover building on [self-hosted, macOS].
# These jobs stay cheap and fast on a GitHub-hosted runner (the default) so PRs get quick feedback;
# the MACOS_RUNNER_LABELS toggle can move them to the self-hosted Studio.

on:
  pull_request:
  push:
    branches: [ develop ]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# On a pull request each job lints only the files the PR adds or changes, so a
# PR goes red only for violations it introduces. The tree as a whole is not yet
# clean (swiftformat: ~150 of 360 files; clang-format: ~12k violations), so the
# full-tree pass still runs on every push to develop, advisory, as the record of
# what a one-time format pass would have to touch.

env:
  # Self-hosted Homebrew is owned by another user: never auto-update or clean up.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  swift:
    name: Swift (swiftlint + swiftformat)
    # Runner toggle: set the repo variable MACOS_RUNNER_LABELS (JSON array, e.g.
    # ["self-hosted","studio"]) to run this job on the Mac Studio; leave it unset to use
    # GitHub-hosted macos-latest. Pull requests from forks ALWAYS run on the hosted runner -
    # never run untrusted fork code on the self-hosted machine.
    runs-on: ${{ (vars.MACOS_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.MACOS_RUNNER_LABELS) || 'macos-latest' }}
    # Blocking on a pull request (only its changed lines count). Advisory on a push
    # to develop: the tree as a whole is not yet clean against .swiftformat /
    # .swiftlint.yml.
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    steps:
      # Self-hosted only, and FIRST (before checkout): swiftlint loads SourceKit from the
      # selected Xcode, so select it explicitly rather than rely on xcode-select state.
      # The Studio has no sudo for `xcode-select -s`, so Xcode is selected with DEVELOPER_DIR
      # (written to GITHUB_ENV, which overrides any job-level value). It defaults to
      # /Applications/Xcode.app (Xcode 27); set the repo variable XCODE_PATH to override.
      - name: Select Xcode (self-hosted)
        if: ${{ runner.environment != 'github-hosted' }}
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH || '/Applications/Xcode.app' }}
        run: |
          set -euo pipefail
          DEV="$XCODE_PATH/Contents/Developer"
          if [ ! -d "$DEV" ]; then
            echo "::error::Xcode not found at $XCODE_PATH on this runner - install it there or set the XCODE_PATH repo variable"
            exit 1
          fi
          echo "DEVELOPER_DIR=$DEV" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEV" xcodebuild -version

      - uses: actions/checkout@v4
        # No submodules: lint doesn't need the Externals/ C++ tree.

      - name: List the pull request's changed files
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          # HEAD is the PR's merge commit, so base..HEAD is exactly the PR's diff.
          git diff --name-only --diff-filter=ACMR "$base" HEAD > "$RUNNER_TEMP/changed_files.txt"
          echo "LINT_CHANGED_FILES=$RUNNER_TEMP/changed_files.txt" >> "$GITHUB_ENV"
          echo "LINT_BASE_SHA=$base" >> "$GITHUB_ENV"
          # Keeps only the findings that land on a line the PR added or changed. A changed file
          # is rarely clean as a whole (the tree is not yet formatted), so a whole-file lint
          # would flag lines the PR never touched. Reads tool output on stdin
          # ("path:line:col: error: ..."), exits 1 when an error is on a changed line.
          cat > "$RUNNER_TEMP/lint_filter.py" <<'PY'
          import os, re, subprocess, sys
          base = sys.argv[1]
          diff = subprocess.run(["git", "diff", "-U0", "--diff-filter=ACMR", base, "HEAD"],
                                capture_output=True, text=True, check=True).stdout
          changed, path = {}, None
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  path = line[6:]
              m = re.match(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@", line)
              if m and path:
                  start, count = int(m.group(1)), int(m.group(2) or 1)
                  changed.setdefault(path, set()).update(range(start, start + count))
          root = os.getcwd() + os.sep
          kept, ignored = [], 0
          for line in sys.stdin:
              m = re.match(r"^(.+?):(\d+):\d+: (error|warning): ", line)
              if not m:
                  continue
              rel = m.group(1)
              if rel.startswith(root):
                  rel = rel[len(root):]
              if int(m.group(2)) in changed.get(rel, ()):
                  kept.append(line.rstrip())
              else:
                  ignored += 1
          print(f"{ignored} finding(s) on lines this PR does not touch ignored.")
          for line in kept:
              print(line)
          errors = [l for l in kept if ": error: " in l]
          print(f"{len(errors)} error(s) on changed lines.")
          sys.exit(1 if errors else 0)
          PY

      - name: Install tools
        run: |
          # Neither tool ships preinstalled on the current macos-latest (macos-26)
          # image; swiftlint was dropped from it, so install both via brew.
          command -v swiftlint >/dev/null || brew install swiftlint
          command -v swiftformat >/dev/null || brew install swiftformat
          swiftlint version
          swiftformat --version

      - name: swiftformat --lint (Source/iOS/App)
        run: |
          set -euo pipefail
          if [ -z "${LINT_CHANGED_FILES:-}" ]; then
            swiftformat --lint Source/iOS/App
            exit 0
          fi
          # --exclude in .swiftformat still applies to files named explicitly.
          files=$(grep -E '^Source/iOS/App/.*\.swift$' "$LINT_CHANGED_FILES" || true)
          if [ -z "$files" ]; then
            echo "No Swift files changed under Source/iOS/App; nothing to check."
            exit 0
          fi
          # swiftformat exits 1 on any finding; the filter decides.
          { echo "$files" | xargs swiftformat --lint 2>&1 || true; } \
            | python3 "$RUNNER_TEMP/lint_filter.py" "$LINT_BASE_SHA"

      - name: swiftlint (Source/iOS/App)
        run: |
          set -euo pipefail
          if [ -z "${LINT_CHANGED_FILES:-}" ]; then
            swiftlint lint --quiet Source/iOS/App
            exit 0
          fi
          # excluded: in .swiftlint.yml still applies to files named explicitly.
          files=$(grep -E '^Source/iOS/App/.*\.swift$' "$LINT_CHANGED_FILES" || true)
          if [ -z "$files" ]; then
            echo "No Swift files changed under Source/iOS/App; nothing to check."
            exit 0
          fi
          { echo "$files" | xargs swiftlint lint --quiet 2>&1 || true; } \
            | python3 "$RUNNER_TEMP/lint_filter.py" "$LINT_BASE_SHA"

  clang-format:
    name: clang-format (iCube ObjC/ObjC++/C++)
    # Runner toggle: set the repo variable MACOS_RUNNER_LABELS (JSON array, e.g.
    # ["self-hosted","studio"]) to run this job on the Mac Studio; leave it unset to use
    # GitHub-hosted macos-latest. Pull requests from forks ALWAYS run on the hosted runner -
    # never run untrusted fork code on the self-hosted machine.
    runs-on: ${{ (vars.MACOS_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.MACOS_RUNNER_LABELS) || 'macos-latest' }}
    # Blocking on a pull request (only its changed lines count). Advisory on a push
    # to develop: the checked-in iCube ObjC/C++ tree is not yet clang-formatted
    # (~12k violations vs Dolphin's Source/.clang-format).
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: List the pull request's changed files
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          # HEAD is the PR's merge commit, so base..HEAD is exactly the PR's diff.
          git diff --name-only --diff-filter=ACMR "$base" HEAD > "$RUNNER_TEMP/changed_files.txt"
          echo "LINT_CHANGED_FILES=$RUNNER_TEMP/changed_files.txt" >> "$GITHUB_ENV"
          echo "LINT_BASE_SHA=$base" >> "$GITHUB_ENV"

      - name: Install clang-format
        run: |
          command -v clang-format >/dev/null || brew install clang-format
          clang-format --version

      - name: clang-format --dry-run -Werror (Source/iOS)
        # iCube ObjC/ObjC++/C/C++ only. The upstream C++ core under Source/Core is
        # intentionally excluded. clang-format auto-discovers Source/.clang-format.
        run: |
          set -euo pipefail
          if [ -n "${LINT_BASE_SHA:-}" ]; then
            # Only the lines the PR adds or changes: the iOS ObjC tree is written in a
            # different style from Source/.clang-format, so a whole changed file is
            # never clean. git-clang-format prints a patch when the changed lines need
            # formatting; its exit code varies by version, so the patch decides.
            out=$(git clang-format --diff --extensions mm,m,cpp,cc,h,hpp \
              "$LINT_BASE_SHA" HEAD -- Source/iOS || true)
            case "$out" in
              ""|"no modified files to format"|"clang-format did not modify any files")
                echo "${out:-clean}"
                exit 0
                ;;
            esac
            echo "$out"
            echo "::error::changed lines need clang-format; the patch is above"
            exit 1
          fi
          files=$(git ls-files \
            'Source/iOS/*.mm' 'Source/iOS/*.m' 'Source/iOS/*.cpp' \
            'Source/iOS/*.cc' 'Source/iOS/*.h'  'Source/iOS/*.hpp')
          if [ -z "$files" ]; then
            echo "No iCube ObjC/C++ files found; nothing to check."
            exit 0
          fi
          # git ls-files is newline-separated; xargs splits on newlines.
          echo "$files" | xargs clang-format --dry-run -Werror
