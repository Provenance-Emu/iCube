name: Release

# Retired. Publishing lives in Build (.github/workflows/build.yml):
#   - push to default branch / develop -> rolling `alpha` prerelease
#   - push tag v* -> permanent GitHub release
# This stub is kept so old Actions URLs still resolve. Do not add
# `on: release` here — publishing the rolling alpha would recurse.
on:
  workflow_dispatch:

jobs:
  notice:
    name: Use Build workflow
    runs-on: ubuntu-latest
    steps:
      - name: Point at the Build workflow
        run: |
          echo "::notice::This workflow is retired. Use the Build workflow to publish the rolling alpha and v* releases."
