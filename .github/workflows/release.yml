name: Release

on:
  release:
    types:
      - published
  # Dry run: builds every product and uploads them as a run artifact, publishes nothing.
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Build the Beta configurations, as a prerelease would'
        type: boolean
        default: false
  # A pull request that changes this workflow dry-runs it, so it is not first tried on a release.
  pull_request:
    branches: [ develop, master ]
    paths:
      - '.github/workflows/release.yml'

# Builds the same way build.yml does: the PVlibDolphin xcframework first, then the Xcode project
# generated from Source/iOS/App/Project.swift by Tuist. This workflow used to archive the
# hand-maintained DolphiniOS.xcodeproj with the upstream "DiOS" schemes and DolphiniOS.app, none
# of which exist any more, on a self-hosted runner the repo does not have. Only a published release
# attaches the products to a GitHub release; a manual run or a pull request touching this file is a
# dry run that uploads them as an artifact.
env:
  # Self-hosted Homebrew is owned by another user: never auto-update or clean up.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    # Runner toggle: set the repo variable MACOS_RUNNER_LABELS (JSON array, e.g.
    # ["self-hosted","studio"]) to run this job on the Mac Studio; leave it unset to use
    # GitHub-hosted macos-26. Pull requests from forks ALWAYS run on the hosted runner -
    # never run untrusted fork code on the self-hosted machine.
    runs-on: ${{ (vars.MACOS_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.MACOS_RUNNER_LABELS) || 'macos-26' }}
    permissions:
      contents: write

    env:
      # Every slice is built up front, so the app's Build Dolphin Core phase skips its rebuild.
      DOL_SKIP_CORE_BUILD: '1'
      TUIST_VERSION: '4.200.0'
      XCODE_VERSION: '26.3'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      XCODE_COMMON_BUILD_ARGS: -workspace Source/iOS/App/iCube.xcworkspace -derivedDataPath "${{ github.workspace }}/build-Xcode" -sdk iphoneos -destination generic/platform=iOS DOL_BUILD_SOURCE="official" CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED="NO" CODE_SIGNING_REQUIRED="NO"

    steps:
      # Self-hosted only, and FIRST (before checkout): the job-level DEVELOPER_DIR names the
      # hosted-only Xcode_26.3.app, and a missing Xcode breaks the /usr/bin/git shim that
      # checkout uses.
      # The Studio has no sudo for `xcode-select -s`, so Xcode is selected with DEVELOPER_DIR
      # (written to GITHUB_ENV, which overrides any job-level value). It defaults to
      # /Applications/Xcode.app (Xcode 27); set the repo variable XCODE_PATH to override.
      - name: Select Xcode (self-hosted)
        if: ${{ runner.environment != 'github-hosted' }}
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH || '/Applications/Xcode.app' }}
        run: |
          set -euo pipefail
          DEV="$XCODE_PATH/Contents/Developer"
          if [ ! -d "$DEV" ]; then
            echo "::error::Xcode not found at $XCODE_PATH on this runner - install it there or set the XCODE_PATH repo variable"
            exit 1
          fi
          echo "DEVELOPER_DIR=$DEV" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEV" xcodebuild -version
          # Xcode 26+ ships the Metal compiler as a separate component. The Studio's Xcode 27
          # had none ("cannot execute tool 'metal' due to missing Metal Toolchain"), and every
          # app build compiles shaders. Installed system-wide, so this is a no-op once present.
          if ! DEVELOPER_DIR="$DEV" xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed'; then
            DEVELOPER_DIR="$DEV" xcodebuild -downloadComponent MetalToolchain
          fi

      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # dpkg-deb for CreateDeb.sh; cmake and ninja are already on the runner.
      - name: Install dpkg
        run: command -v dpkg-deb >/dev/null || brew install dpkg

      - name: Select Xcode
        if: ${{ runner.environment == 'github-hosted' }}
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # A prerelease, or a dry run asked to, builds the Beta configurations; a pull request's dry
      # run builds the normal ones.
      - name: Select configurations
        env:
          PRERELEASE: ${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.prerelease) }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "XCODE_CONFIGURATION_NJB=Release (Beta, Non-Jailbroken)" >> "$GITHUB_ENV"
            echo "XCODE_CONFIGURATION_JB=Release (Beta, Jailbroken)" >> "$GITHUB_ENV"
            echo "XCODE_CONFIGURATION_TS=Release (Beta, TrollStore)" >> "$GITHUB_ENV"
            echo "DEB_CONTROL_NAME=control-beta" >> "$GITHUB_ENV"
          else
            echo "XCODE_CONFIGURATION_NJB=Release (Non-Jailbroken)" >> "$GITHUB_ENV"
            echo "XCODE_CONFIGURATION_JB=Release (Jailbroken)" >> "$GITHUB_ENV"
            echo "XCODE_CONFIGURATION_TS=Release (TrollStore)" >> "$GITHUB_ENV"
            echo "DEB_CONTROL_NAME=control-normal" >> "$GITHUB_ENV"
          fi
          echo "Prerelease configurations: $PRERELEASE"

      # Shares build.yml's cache: a release of a commit develop already built restores its slices.
      - name: Restore Dolphin xcframework cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: dolphin-xcf-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dolphin-xcf-${{ runner.os }}-

      - name: Build PVlibDolphin xcframework
        run: |
          set -euo pipefail
          python3 BuildiOSXCFramework.py --platforms OS64 SIMULATORARM64 TVOS SIMULATOR_TVOS
          ls -d build/xcframework/* 2>/dev/null || { echo "::error::BuildiOSXCFramework.py produced no xcframework output"; exit 1; }

      # After the xcframework build: `tuist generate` resolves the binary target eagerly.
      - name: Install Tuist
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          MISE="$HOME/.local/bin/mise"
          "$MISE" use -g "tuist@${TUIST_VERSION}"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          "$HOME/.local/share/mise/shims/tuist" version

      - name: Generate Xcode project
        working-directory: Source/iOS/App
        run: |
          set -euo pipefail
          tuist install
          tuist generate --no-open
          ls -d iCube.xcworkspace iCube.xcodeproj

      - name: Build Application
        run: |
          set -o pipefail
          rm -rf "${{ github.workspace }}/archives" || true
          mkdir "${{ github.workspace }}/archives"
          xcodebuild archive -archivePath "${{ github.workspace }}/archives/NonJailbroken.xcarchive" -configuration "${{ env.XCODE_CONFIGURATION_NJB }}" -scheme "iCube (NJB)" ${{ env.XCODE_COMMON_BUILD_ARGS }} 2>&1 | tee -a "${{ runner.temp }}/xcodebuild-icube.log"
          xcodebuild archive -archivePath "${{ github.workspace }}/archives/Jailbroken.xcarchive" -configuration "${{ env.XCODE_CONFIGURATION_JB }}" -scheme "iCube (JB)" ${{ env.XCODE_COMMON_BUILD_ARGS }} 2>&1 | tee -a "${{ runner.temp }}/xcodebuild-icube.log"
          xcodebuild archive -archivePath "${{ github.workspace }}/archives/TrollStore.xcarchive" -configuration "${{ env.XCODE_CONFIGURATION_TS }}" -scheme "iCube (JB)" ${{ env.XCODE_COMMON_BUILD_ARGS }} 2>&1 | tee -a "${{ runner.temp }}/xcodebuild-icube.log"

      - name: Upload raw xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-icube-log
          path: ${{ runner.temp }}/xcodebuild-icube.log
          retention-days: 7
          if-no-files-found: warn

      - name: Build IPA Files
        run: |
          mkdir "${{ github.workspace }}/products"
          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateIpa.sh" "${{ github.workspace }}/archives/NonJailbroken.xcarchive/Products/Applications/iCube.app" "-" "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Public.entitlements" "${{ github.workspace }}/products/Non-Jailbroken.ipa"
          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateIpa.sh" "${{ github.workspace }}/archives/TrollStore.xcarchive/Products/Applications/iCube.app" "-" "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Private.entitlements" "${{ github.workspace }}/products/TrollStore.tipa"

      - name: Build DEB File
        run: |
          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateDeb.sh" "${{ github.workspace }}/archives/Jailbroken.xcarchive/Products/Applications/iCube.app" "-" "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Private.entitlements" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/${{ env.DEB_CONTROL_NAME }}.in" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/postinst.sh" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/postrm.sh" "Applications" "${{ github.workspace }}/products/Jailbroken-Rootful.deb"
          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateDeb.sh" "${{ github.workspace }}/archives/Jailbroken.xcarchive/Products/Applications/iCube.app" "-" "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Private.entitlements" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/${{ env.DEB_CONTROL_NAME }}-rootless.in" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/postinst.sh" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/postrm.sh" "var/jb/Applications" "${{ github.workspace }}/products/Jailbroken-Rootless.deb"

      - name: Upload products (dry run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-products
          path: products/
          retention-days: 7
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            products/Non-Jailbroken.ipa
            products/TrollStore.tipa
            products/Jailbroken-Rootful.deb
            products/Jailbroken-Rootless.deb
