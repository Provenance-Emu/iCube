name: Build

on:
  # develop is the DEFAULT branch now; these triggers still named master only,
  # so no push to develop has ever started a build — which is the other half of
  # why nothing has published since 4.1.0beta5. master is kept for any branch
  # still pointing there.
  push:
    branches: [ develop, master ]
    paths-ignore:
      - 'docs/**'
      - 'Tools/mcp/**'
      - '**/*.md'
  pull_request:
    branches: [ develop, master ]
    paths-ignore:
      - 'docs/**'
      - 'Tools/mcp/**'
      - '**/*.md'
  workflow_dispatch:

# The `alpha` release is a rolling tag -- one prerelease, always the current tip
# -- and every successful run moves it and clobbers its assets. Without a
# concurrency group, two overlapping pushes both reach `gh release upload
# --clobber` and the LAST one to finish wins, which is not necessarily the newer
# commit. Runs 96 and 97 (2026-09-19, 27 seconds apart) both succeeded and both
# published; 98, 99 and 100 had to be cancelled by hand to stop the same thing.
#
# It matters more now that build numbers are real: each run stamps its own
# CURRENT_PROJECT_VERSION, so a race publishes an IPA whose CFBundleVersion is
# whichever run happened to land last, and the feed can end up naming the other
# one. Cancel superseded runs instead -- for a rolling artifact, a half-built
# older commit has no value, and this is what was being done manually anyway.
#
# Keyed on ref, so develop, master and each pull request queue independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted. This was `[self-hosted, macOS]`, but the repo has ZERO
    # registered runners: run 33592678140 sat queued for hours with
    # runner=unassigned, and every historical run was eventually cancelled.
    # Nothing has published since 4.1.0beta5 (Sept 2025) as a result.
    # macos-26 + Xcode 26.x, matching Provenance's build.yml. On macos-15 the
    # runner default is Xcode 16.x / iPhoneOS18.5.sdk, and the app uses iOS 26
    # APIs -- glassEffect, searchToolbarBehavior, navigationSubtitle. Those call
    # sites are already correctly wrapped in `if #available(iOS 26.0, tvOS 26.0,
    # *)`, but an availability guard cannot conjure a symbol the SDK does not
    # ship, so they presented as compile errors when the real fault was the
    # toolchain. Adding #if guards would have been the wrong fix -- it would
    # delete working iOS 26 code to satisfy a toolchain that should not be in use.
    runs-on: macos-26

    env:
      # DOL_PBID_ORGANIZATION_IDENTIFIER is NOT overridden here any more. It
      # used to force "me.oatmealdome" on the command line, which outranks
      # Config/BundleIdentifier.xcconfig and shipped every CI build under the
      # UPSTREAM author's identifier instead of ours. The xcconfig already says
      # com.joemattiello, so letting it win yields com.joemattiello.iCube
      # (and com.joemattiello.iCube-ts for TrollStore), which is what the
      # sideload feed lists.
      # Pinned deliberately: nothing in the repo pins Tuist, so an unpinned
      # install tracks latest and any Tuist release could break generation.
      TUIST_VERSION: '4.200.0'
      XCODE_VERSION: '26.3'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # CURRENT_PROJECT_VERSION is stamped here for the same reason release.yml
      # stamps it. The pbxproj hardcodes 13, so before this EVERY alpha shipped
      # as CFBundleVersion 13 forever. AltStore/SideStore decide an update exists
      # by comparing the feed's buildVersion against the installed bundle's, so a
      # constant one means the rolling alpha can never offer an update no matter
      # how many times it is rebuilt -- users sit on whichever alpha they first
      # installed. github.run_number is strictly increasing and costs nothing;
      # `git rev-list --count HEAD` would need fetch-depth: 0 on a repo cloned
      # with `submodules: recursive`, which is not a cheap ask for a build number.
      XCODE_COMMON_BUILD_ARGS: -workspace Source/iOS/App/iCube.xcworkspace -derivedDataPath "${{ github.workspace }}/build-Xcode" -sdk iphoneos -destination generic/platform=iOS DOL_BUILD_SOURCE="development" CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED="NO" CODE_SIGNING_REQUIRED="NO"
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      # - name: Set Xcode Version
      #   run: sudo xcode-select -s /Applications/Xcode_14.2.app

      # - name: Install Build Utilities
      #   run: |
      #     brew install cmake ninja bartycrouch
      #     /usr/bin/python3 -m pip install polib

      # dpkg provides dpkg-deb, which CreateDeb.sh needs:
      #   Scripts/CreateDeb.sh: line 42: dpkg-deb: command not found
      # It was in the commented-out "Install Build Utilities" step and only ever
      # existed on the retired self-hosted runner.
      #
      # Installed rather than skipped-when-absent, which is how bartycrouch was
      # handled. That was right there -- UpdateStoryboardStrings.sh regenerates
      # committed .strings and the archive is identical either way -- but the
      # DEB is a real artifact for jailbroken distribution, so skipping it would
      # silently stop shipping the JB package instead of failing loudly.
      #
      # cmake and ninja from that old step are NOT installed here: the runner
      # already has them at /opt/homebrew/bin, and BuildiOSXCFramework.py has
      # been succeeding with them.
      - name: Install dpkg
        run: brew install dpkg

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set Schema
        run: |
          echo "XCODE_CONFIGURATION_NJB=Release (Non-Jailbroken)" >> $GITHUB_ENV
          echo "XCODE_CONFIGURATION_JB=Release (Jailbroken)" >> $GITHUB_ENV
          echo "XCODE_CONFIGURATION_TS=Release (TrollStore)" >> $GITHUB_ENV
          echo "DEB_CONTROL_NAME=control-normal" >> $GITHUB_ENV
      
      # PVlibDolphin.xcframework is a PREBUILT dependency the Xcode project links
      # against (build/xcframework/PVlibDolphin-ios*.framework). Nothing in CI
      # ever produced it, so the archive died with
      #   error: There is no XCFramework found at .../build/xcframework/PVlibDolphin...
      # It existed only on a machine that had run BuildiOSXCFramework.py by hand.
      #
      # All four slices the pbxproj references: OS64 / SIMULATORARM64 (iOS
      # device + simulator) and TVOS / SIMULATOR_TVOS. The iOS archive alone
      # would only need the first two, but the project carries file references
      # to all four, and a reference Xcode cannot resolve is a build error
      # rather than a skipped target. MAC_CATALYST is deliberately omitted --
      # nothing references it.
      #
      # The script builds incrementally, so cache build/ with a PREFIX restore
      # key rather than an exact one: a near-miss still restores the previous
      # object files and only the delta is recompiled. Saving is split out so a
      # later failure does not discard a completed Dolphin build.
      - name: Restore Dolphin xcframework cache
        id: dolphincache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: dolphin-xcf-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dolphin-xcf-${{ runner.os }}-

      - name: Build PVlibDolphin xcframework
        id: dolphinbuild
        run: |
          set -euo pipefail
          if [ -d build/xcframework/PVlibDolphin-ios.framework ]; then
            echo "  cached slices present, letting the script confirm incrementally"
          fi
          python3 BuildiOSXCFramework.py --platforms OS64 SIMULATORARM64 TVOS SIMULATOR_TVOS
          echo "--- produced ---"
          ls -d build/xcframework/* 2>/dev/null || { echo "::error::BuildiOSXCFramework.py produced no xcframework output"; exit 1; }

      - name: Save Dolphin xcframework cache
        if: always() && steps.dolphinbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build
          key: dolphin-xcf-${{ runner.os }}-${{ github.sha }}

      # Generate the Xcode project from Project.swift instead of building the
      # checked-in DolphiniOS.xcodeproj.
      #
      # Those two had drifted badly: repairing the checked-in project by hand
      # took 131 stale file-reference removals, 20 missing-source additions and
      # one cross-repo absolute-path group deletion in a single session, and
      # every one was drift from Project.swift rather than an independent
      # mistake. Generating removes the drift class rather than repairing it
      # repeatedly.
      #
      # It also fixes the PGOFlush.h failure structurally: Tuist emits no file
      # references for headers and sets HEADER_SEARCH_PATHS to $(SRCROOT)/Common/**
      # recursively, which is how the bridging header's basename-only imports
      # resolve. That bug was only reachable because CI built the hand-maintained
      # project.
      #
      # ORDER MATTERS: `tuist generate` resolves the .xcframework binary target
      # eagerly, so it must run AFTER the PVlibDolphin build above. Reversed, it
      # fails with "Couldn't find xcframework at .../PVlibDolphin.xcframework".
      #
      # The checked-in DolphiniOS.xcodeproj is deliberately left in place for now
      # as a local-dev fallback; remove it once this path has proven itself.
      - name: Install Tuist
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          MISE="$HOME/.local/bin/mise"
          # Pinned: nothing in the repo pins a Tuist version, so an unpinned
          # install would silently track latest and could break generation on
          # any Tuist release. 4.200.0 is the version this was verified against.
          "$MISE" use -g "tuist@${TUIST_VERSION}"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          "$HOME/.local/share/mise/shims/tuist" version

      - name: Generate Xcode project
        working-directory: Source/iOS/App
        run: |
          set -euo pipefail
          tuist install
          tuist generate --no-open
          ls -d iCube.xcworkspace iCube.xcodeproj

      # Tee the raw xcodebuild output. Run Script phase failures (this build has
      # 'Update Storyboard Strings', 'Build Dolphin Core', 'Setup Python') emit
      # NO `error:` line and their stderr does not reach the Actions console —
      # a failure shows only "(2 failures)" with the phase name and nothing
      # actionable. The raw log is the only place the script's own output lives.
      - name: Build Application
        run: |
          set -o pipefail
          rm -rf "${{ github.workspace }}/archives" || true
          mkdir "${{ github.workspace }}/archives"
          xcodebuild archive -archivePath "${{ github.workspace }}/archives/NonJailbroken.xcarchive" -configuration "${{ env.XCODE_CONFIGURATION_NJB }}" -scheme "iCube (NJB)" ${{ env.XCODE_COMMON_BUILD_ARGS }} 2>&1 | tee -a "${{ runner.temp }}/xcodebuild-icube.log"
          xcodebuild archive -archivePath "${{ github.workspace }}/archives/Jailbroken.xcarchive" -configuration "${{ env.XCODE_CONFIGURATION_JB }}" -scheme "iCube (JB)" ${{ env.XCODE_COMMON_BUILD_ARGS }} 2>&1 | tee -a "${{ runner.temp }}/xcodebuild-icube.log"
          xcodebuild archive -archivePath "${{ github.workspace }}/archives/TrollStore.xcarchive" -configuration "${{ env.XCODE_CONFIGURATION_TS }}" -scheme "iCube (JB)" ${{ env.XCODE_COMMON_BUILD_ARGS }} 2>&1 | tee -a "${{ runner.temp }}/xcodebuild-icube.log"
      
      - name: Upload raw xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-icube-log
          path: ${{ runner.temp }}/xcodebuild-icube.log
          retention-days: 7
          if-no-files-found: warn

      - name: Build IPA Files
        run: |
          mkdir "${{ github.workspace }}/products"
          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateIpa.sh" "${{ github.workspace }}/archives/NonJailbroken.xcarchive/Products/Applications/iCube.app" "-" "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Public.entitlements" "${{ github.workspace }}/products/Non-Jailbroken.ipa"
          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateIpa.sh" "${{ github.workspace }}/archives/TrollStore.xcarchive/Products/Applications/iCube.app" "-" "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Private.entitlements" "${{ github.workspace }}/products/TrollStore.tipa"
      
      - name: Build DEB File
        run: |
          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateDeb.sh" "${{ github.workspace }}/archives/Jailbroken.xcarchive/Products/Applications/iCube.app" "-" "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Private.entitlements" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/${{ env.DEB_CONTROL_NAME }}.in" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/postinst.sh" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/postrm.sh" "Applications" "${{ github.workspace }}/products/Jailbroken-Rootful.deb"
          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateDeb.sh" "${{ github.workspace }}/archives/Jailbroken.xcarchive/Products/Applications/iCube.app" "-" "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Private.entitlements" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/${{ env.DEB_CONTROL_NAME }}-rootless.in" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/postinst.sh" "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/postrm.sh" "var/jb/Applications" "${{ github.workspace }}/products/Jailbroken-Rootless.deb"
      

      # develop's build job produced IPAs in products/ but uploaded NOTHING, so
      # there was nothing for a publish job to consume. The alpha-release job
      # below expects an artifact named icube-ipas.
      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: icube-ipas
          path: products
          if-no-files-found: error
          retention-days: 14

  alpha-release:
    name: Update Alpha Release
    needs: build
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push'
      ) &&
      !startsWith(github.ref, 'refs/tags/') &&
      (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        github.ref == 'refs/heads/develop'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: alpha
      ISSUE_TITLE: 'Alpha builds — download, install, and what they are'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: icube-ipas
          path: products

      - name: Prepare alpha body
        id: prep_body
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          SHORT_SHA="${SHA:0:7}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          BODY_FILE="$RUNNER_TEMP/alpha_body.md"

          PREV_SHA=$(gh api "repos/${REPO}/git/refs/tags/${TAG}" --jq '.object.sha' 2>/dev/null || echo "")

          CHANGES=""
          if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$SHA" ] \
            && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            # -n 40 instead of "| head -40": under pipefail, head closing the pipe made git
            # exit 141 (SIGPIPE) whenever there were more than 40 commits, failing the step.
            CHANGES=$(git log --oneline --no-merges -n 40 "${PREV_SHA}..${SHA}")
          fi
          [ -n "$CHANGES" ] || CHANGES=$(git log --oneline --no-merges -10)

          {
            echo "## Alpha Build \`${SHORT_SHA}\`"
            echo
            echo "**Automated alpha build from \`${GITHUB_REF_NAME}\`**"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Commit** | [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${REPO}/commit/${SHA}) |"
            echo "| **Built** | ${DATE} |"
            echo "| **CI Run** | [View build log](${RUN_URL}) |"
            echo
            echo "> Unsigned sideload builds. Replaced on every successful push to the default branch or \`develop\`. For a stable build use the [latest release](${GITHUB_SERVER_URL}/${REPO}/releases/latest)."
            echo
            echo "### Commits since last alpha"
            echo
            echo '```'
            echo "${CHANGES}"
            echo '```'
            echo
            echo "### Artifacts"
            echo
            echo "- \`Non-Jailbroken.ipa\` — SideStore / AltStore / Sideloadly"
            echo "- \`TrollStore.tipa\` — TrollStore"
            echo "- \`Jailbroken-Rootful.deb\` / \`Jailbroken-Rootless.deb\` — jailbroken devices"
            echo
            echo "> This release is automatically updated on every successful default-branch / \`develop\` CI run."
          } > "$BODY_FILE"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Move alpha tag
        run: |
          set -euo pipefail
          # -F (typed) for force so it serialises as a JSON boolean; -f would
          # send the string "true", which the refs API rejects with 422.
          gh api "repos/${REPO}/git/refs/tags/${TAG}" \
            -X PATCH -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || \
          gh api "repos/${REPO}/git/refs" \
            -X POST -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null

      - name: Publish alpha prerelease
        run: |
          set -euo pipefail
          TITLE="iCube Alpha (${{ steps.prep_body.outputs.short_sha }})"
          shopt -s nullglob
          FILES=(products/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::warning::No IPA/deb files to attach"
            FILES=()
          fi
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${REPO}" \
              --title "${TITLE}" \
              --notes-file "${{ steps.prep_body.outputs.body_file }}" \
              --target "${GITHUB_SHA}" \
              --prerelease --draft=false
            if [ ${#FILES[@]} -gt 0 ]; then
              gh release upload "${TAG}" --repo "${REPO}" "${FILES[@]}" --clobber
            fi
            REL_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .id)
            gh api -X PATCH "repos/${REPO}/releases/${REL_ID}" -F draft=true >/dev/null
            gh api -X PATCH "repos/${REPO}/releases/${REL_ID}" \
              -F draft=false -F prerelease=true >/dev/null
          else
            gh release create "${TAG}" --repo "${REPO}" \
              --title "${TITLE}" \
              --notes-file "${{ steps.prep_body.outputs.body_file }}" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              "${FILES[@]}"
          fi

      # ── Immutable per-build release ──────────────────────────────────
      # The rolling `alpha` tag is the right thing for a human: one link, always
      # the current tip. It is the wrong thing for a sideload feed to link.
      #
      # AltStore and SideStore verify a downloaded bundle against the version
      # strings the feed advertised, and that feed is a snapshot taken whenever
      # icube-emu.com last rebuilt. So every time this job clobbers the alpha
      # assets, the live feed names a CFBundleVersion the rolling URL no longer
      # serves, and installs fail until the site redeploys. Scoping
      # FEED_DISPATCH_TOKEN shortens that window; it cannot remove it, because a
      # static feed pointing at mutable bytes is wrong by construction.
      #
      # Giving each build its own tag removes it. The feed links bytes that can
      # never be replaced, so a stale feed offers an OLDER alpha instead of a
      # broken one. The tag carries the run number, which is exactly what
      # CURRENT_PROJECT_VERSION was stamped with in the build job, so the tag
      # name and the IPA's CFBundleVersion are the same number by construction
      # and a mismatch is visible without downloading anything.
      #
      # Only the sideload IPA is pinned. The rolling `alpha` release still
      # carries all four artifacts for people clicking through by hand; these
      # exist to be linked by a machine.
      - name: Publish immutable per-build release
        run: |
          set -euo pipefail
          PIN_TAG="alpha-${GITHUB_RUN_NUMBER}"
          IPA="products/Non-Jailbroken.ipa"
          if [ ! -s "$IPA" ]; then
            echo "::warning::no Non-Jailbroken.ipa to pin — skipping $PIN_TAG"
            exit 0
          fi

          NOTES="Immutable snapshot of alpha build ${GITHUB_RUN_NUMBER} (\`${GITHUB_SHA:0:7}\`).

          This tag exists so the sideload feed can link bytes that never change.
          Its \`Non-Jailbroken.ipa\` carries \`CFBundleVersion ${GITHUB_RUN_NUMBER}\`,
          matching the tag name. For the newest build, use the rolling
          [\`alpha\`](${GITHUB_SERVER_URL}/${REPO}/releases/tag/alpha) release instead.

          Pruned automatically; only the most recent few are kept."

          # A re-run reuses the run number, and rebuilds the same commit, so
          # replacing the asset keeps the tag honest rather than failing the job.
          if gh release view "$PIN_TAG" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "$PIN_TAG" --repo "${REPO}" "$IPA" --clobber
            echo "Replaced asset on existing $PIN_TAG (workflow re-run)"
          else
            gh release create "$PIN_TAG" --repo "${REPO}" \
              --title "iCube alpha build ${GITHUB_RUN_NUMBER}" \
              --notes "$NOTES" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              "$IPA"
            echo "Published $PIN_TAG"
          fi

      # Keep a handful for rollback and so a stale feed still links something
      # that exists; delete the rest with their tags. The pattern is anchored on
      # purpose -- `alpha` itself, and every `v*` release tag, must never match.
      - name: Prune old per-build releases
        continue-on-error: true
        env:
          KEEP: '5'
        run: |
          set -uo pipefail
          OLD=$(gh release list --repo "${REPO}" --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null \
                | grep -E '^alpha-[0-9]+$' \
                | sort -t- -k2 -n -r \
                | tail -n +$((KEEP + 1)) || true)
          if [ -z "$OLD" ]; then
            echo "nothing to prune"
            exit 0
          fi
          echo "$OLD" | while read -r tag; do
            [ -n "$tag" ] || continue
            if gh release delete "$tag" --repo "${REPO}" --cleanup-tag --yes; then
              echo "pruned $tag"
            else
              echo "::warning::could not prune $tag"
            fi
          done

      # iCube is listed in the COMBINED sideload source at
      # https://provenance-emu.com/apps.json, generated by
      # Provenance-Emu/Provenance/.github/workflows/sideload-feed.yml. It reads
      # this repo's public releases directly, picking Non-Jailbroken.ipa --
      # TrollStore.tipa is deliberately excluded, since TrollStore installs by a
      # different route and is wrong for AltStore/SideStore.
      #
      # Ping the generator so a new alpha appears in the feed immediately
      # instead of waiting for the next Provenance develop build to regenerate
      # it. GITHUB_TOKEN cannot dispatch across repos, so this needs a PAT with
      # `repo` scope stored here as FEED_DISPATCH_TOKEN. It warns and skips when
      # unset, and never fails the job -- a missed notification just means the
      # feed refreshes on the next Provenance build.
      - name: Refresh combined sideload feed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FEED_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::FEED_DISPATCH_TOKEN not set — skipping feed refresh. \
          The combined feed will pick this release up on the next Provenance build."
            exit 0
          fi
          gh api repos/Provenance-Emu/Provenance/dispatches \
            -f event_type=companion-release \
            -F client_payload[app]=icube \
            && echo "Requested combined-feed refresh" \
            || echo "::warning::Feed dispatch failed; next Provenance build will refresh it"

      # icube-emu.com has its OWN AltStore/SideStore feed (/api/altstore,
      # /api/sidestore) and also hosts the IPA the combined feed above links to.
      # Its deploy.yml fetches the current alpha at build time, but only runs on
      # a push to that repo or on this dispatch -- nothing else ever told it a
      # release happened, which is why the site served a day-old IPA while
      # GitHub had the new one. Same PAT, same event type deploy.yml listens for.
      - name: Refresh icube-emu.com feed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FEED_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::FEED_DISPATCH_TOKEN not set — skipping icube-emu.com refresh."
            exit 0
          fi
          # Report WHY, not just that it failed. This step has been failing
          # silently since 2026-09-02: the site repo has never once received a
          # repository_dispatch, while the identical call to Provenance-Emu/
          # Provenance in the step above has succeeded 51 times with the same
          # token. That is the signature of a fine-grained PAT whose repository
          # access list includes Provenance but not icube-emu.github.io -- the
          # permissions are already correct, the repo just is not on the list.
          # A fine-grained PAT returns 404 (not 403) for a repo it cannot see,
          # so both are treated as the same diagnosis.
          #
          # The consequence used to be cosmetic; it is not any more. The feed now
          # publishes the alpha's real CFBundleVersion, so until the site
          # redeploys it advertises a build number the rolling IPA no longer
          # carries, and SideStore refuses to install it. deploy.yml's */15 cron
          # is the only thing closing that window.
          if out=$(gh api repos/Provenance-Emu/icube-emu.github.io/dispatches \
            -f event_type=companion-release \
            -F client_payload[app]=icube 2>&1); then
            echo "Requested icube-emu.com redeploy"
          else
            case "$out" in
              *404*|*403*|*"Not Found"*|*"Resource not accessible"*)
                echo "::warning::FEED_DISPATCH_TOKEN cannot reach \
          Provenance-Emu/icube-emu.github.io. Add that repo to the token's \
          repository access list (github.com/settings/personal-access-tokens). \
          Until then the site feed lags the alpha by up to its */15 cron, and \
          installs fail during that window." ;;
              *)
                echo "::warning::icube-emu.com dispatch failed: ${out}" ;;
            esac
            echo "Close the window by hand with: \
          gh workflow run deploy.yml -R Provenance-Emu/icube-emu.github.io"
          fi

      - name: Update pinned tracking issue
        continue-on-error: true
        run: |
          set -euo pipefail
          SHORT_SHA="${{ steps.prep_body.outputs.short_sha }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          BODY_FILE="$RUNNER_TEMP/issue_body.md"
          {
            echo "# Alpha Builds — Download & Install Guide"
            echo
            echo "## Latest Alpha Build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Status** | :white_check_mark: Build Passing |"
            echo "| **Commit** | [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${REPO}/commit/${GITHUB_SHA}) |"
            echo "| **Built** | ${DATE} |"
            echo "| **CI Run** | [View build log](${RUN_URL}) |"
            echo "| **Download** | [\`alpha\` release](${GITHUB_SERVER_URL}/${REPO}/releases/tag/alpha) |"
            echo
            echo "---"
            echo
            echo "### What these are"
            echo
            echo "Every successful push to the **default branch** or \`develop\` rebuilds unsigned IPAs/debs and replaces the single [\`alpha\`](${GITHUB_SERVER_URL}/${REPO}/releases/tag/alpha) prerelease. There is only ever one alpha — the current tip."
            echo
            echo "| | Stable | Alpha |"
            echo "|---|---|---|"
            echo "| **Source** | tagged \`v*\` releases | automatic builds from the default branch / \`develop\` |"
            echo "| **Updates** | periodic | every successful CI run |"
            echo "| **Use it for** | daily play | testing a fix before it ships |"
            echo
            echo "### Installing"
            echo
            echo "1. Download from the [\`alpha\` release](${GITHUB_SERVER_URL}/${REPO}/releases/tag/alpha):"
            echo "   - **SideStore / AltStore / Sideloadly:** \`Non-Jailbroken.ipa\`"
            echo "   - **TrollStore:** \`TrollStore.tipa\`"
            echo "   - **Jailbroken:** \`Jailbroken-Rootful.deb\` or \`Jailbroken-Rootless.deb\`"
            echo "2. Sideload with your preferred installer. Website: [icube-emu.com/downloads](https://icube-emu.com/downloads/)."
            echo
            echo "### Reporting a bug in an alpha"
            echo
            echo "Please [open an issue](${GITHUB_SERVER_URL}/${REPO}/issues/new) and include:"
            echo "- The commit SHA (\`${SHORT_SHA}\` or newer — Settings > About if shown)"
            echo "- Steps to reproduce"
            echo "- Device model and iOS/tvOS version"
            echo
            echo "---"
            echo
            echo "> Auto-updated by CI on every alpha build. Edits here are overwritten."
          } > "$BODY_FILE"

          LABEL=alpha-tracker
          gh label create "$LABEL" --repo "${REPO}" --color 0E8A16 \
            --description "Auto-updated alpha build tracker" >/dev/null 2>&1 || true

          NUM=$(gh issue list --repo "${REPO}" --state all --label "$LABEL" \
                  --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$NUM" ]; then
            NUM=$(gh issue list --repo "${REPO}" --state all --limit 500 \
                    --json number,title \
                    --jq "map(select(.title == \"${ISSUE_TITLE}\")) | .[0].number // empty")
          fi

          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "${REPO}" --body-file "$BODY_FILE" \
              --add-label "$LABEL" >/dev/null
          else
            NUM=$(gh issue create --repo "${REPO}" \
                    --title "${ISSUE_TITLE}" \
                    --body-file "$BODY_FILE" \
                    | grep -oE '[0-9]+$')
            gh issue edit "$NUM" --repo "${REPO}" --add-label "$LABEL" >/dev/null 2>&1 || \
              echo "::warning::could not label tracking issue #${NUM}; title match is now the only lookup"
            echo "==> Created tracking issue #${NUM}"
          fi

          ID=$(gh api "repos/${REPO}/issues/${NUM}" --jq '.node_id')
          gh api graphql -f query='mutation($id:ID!){pinIssue(input:{issueId:$id}){issue{number}}}' \
            -f id="$ID" >/dev/null 2>&1 || \
            echo "::warning::could not pin issue #${NUM} (already pinned, 3-pin cap, or permission)"

          echo "==> Tracking issue: ${GITHUB_SERVER_URL}/${REPO}/issues/${NUM}"
